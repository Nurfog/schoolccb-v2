  <text x="335" y="434" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" fill="#4fc3f7" font-weight="600">SIGE MINEDUC</text>

  <rect x="430" y="410" width="180" height="36" rx="18" fill="#4fc3f7" opacity="0.15"/>
  <text x="520" y="434" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" fill="#4fc3f7" font-weight="600">Webpay Integrado</text>

  <!-- Description -->
  <text x="80" y="490" font-family="Inter,sans-serif" font-size="20" fill="#64748B">Administración de alumnos, notas, asistencia, finanzas y RRHH</text>
  <text x="80" y="530" font-family="Inter,sans-serif" font-size="20" fill="#64748B">para colegios chilenos. Diseñado para el éxito educativo.</text>

