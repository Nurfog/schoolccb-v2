  <path d="M97 122V97l18-10 18 10v25" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M97 109l18 10 18-10" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <text x="115" y="132" text-anchor="middle" fill="white" font-size="22" font-weight="800" font-family="Inter,sans-serif">SC</text>

