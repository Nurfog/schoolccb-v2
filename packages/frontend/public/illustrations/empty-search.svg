<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EDF1"/>
      <stop offset="100%" stop-color="#F8F9FA"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Search magnifying glass -->
  <circle cx="180" cy="140" r="35" stroke="#1A2B3C" stroke-width="3" opacity="0.12"/>
  <line x1="206" y1="166" x2="225" y2="185" stroke="#1A2B3C" stroke-width="3" stroke-linecap="round" opacity="0.12"/>

  <!-- Question marks -->
  <text x="240" y="105" font-family="Inter,sans-serif" font-size="24" fill="#94A3B8" font-weight="700" opacity="0.3">?</text>
  <text x="260" y="85" font-family="Inter,sans-serif" font-size="18" fill="#94A3B8" font-weight="700" opacity="0.2">?</text>

  <!-- Documents -->
  <rect x="110" y="180" width="55" height="70" rx="4" fill="white" stroke="#1A2B3C" stroke-width="1.5" opacity="0.2"/>
  <line x1="118" y1="192" x2="157" y2="192" stroke="#1A2B3C" stroke-width="1.2" opacity="0.15"/>
  <line x1="118" y1="200" x2="150" y2="200" stroke="#1A2B3C" stroke-width="1.2" opacity="0.15"/>

  <rect x="130" y="185" width="55" height="70" rx="4" fill="white" stroke="#1A2B3C" stroke-width="1.5" opacity="0.15"/>
  <line x1="138" y1="197" x2="177" y2="197" stroke="#1A2B3C" stroke-width="1.2" opacity="0.1"/>
  <line x1="138" y1="205" x2="170" y2="205" stroke="#1A2B3C" stroke-width="1.2" opacity="0.1"/>

  <!-- Dots scattered -->
  <circle cx="200" cy="105" r="2" fill="#94A3B8" opacity="0.3"/>
  <circle cx="100" cy="120" r="2" fill="#94A3B8" opacity="0.2"/>
  <circle cx="310" cy="150" r="2" fill="#94A3B8" opacity="0.2"/>
  <circle cx="290" cy="200" r="2" fill="#94A3B8" opacity="0.3"/>
</svg>
