{% extends "base.html" %}
{% block content %}
<section class="section">
    <div class="container">
        <h2>Características de SchoolCBB</h2>
        <div class="features-grid">
            {% for f in features %}
            <div class="feature-item">
                <h3>{{ f.name }}</h3>
                <p>{{ f.description }}</p>
            </div>
            {% endfor %}
        </div>
        {% if features|length == 0 %}
        <div class="faq-cta">
            <p>Las características se cargan dinámicamente. Si no ves nada, <a href="/contact">contáctanos</a>.</p>
        </div>
        {% endif %}
    </div>
</section>
{% endblock %}
