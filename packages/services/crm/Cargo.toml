[package]
name = "schoolccb-crm"
version = "0.1.0"
edition = "2024"

[dependencies]
schoolccb-common = { path = "../../common", features = ["db"] }
async-trait.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tower = { version = "0.5", features = ["util"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
jsonwebtoken.workspace = true
reqwest = { workspace = true, features = ["json"] }
printpdf = "0.7"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder"] }
