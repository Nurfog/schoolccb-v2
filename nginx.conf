resolver 127.0.0.11 valid=10s;

gzip on;
gzip_comp_level 6;
gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml image/png image/x-icon;
gzip_min_length 256;
gzip_vary on;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.svg$ {
        add_header Content-Type "image/svg+xml";
        expires 1y;
    }

    location /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
    }

    location /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8";
    }

    location /manifest.json {
        add_header Content-Type "application/json; charset=utf-8";
    }

    location /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # Portal login API (needs one_time_code flow)
    location = /api/auth/login {
        proxy_pass http://portal:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        set $gateway_upstream http://gateway:3000;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Portal public pages
    location = /features { proxy_pass http://portal:3010; proxy_set_header Host $host; }
    location = /pricing  { proxy_pass http://portal:3010; proxy_set_header Host $host; }
    location = /about    { proxy_pass http://portal:3010; proxy_set_header Host $host; }
    location = /contact  { proxy_pass http://portal:3010; proxy_set_header Host $host; }
    location /blog       { proxy_pass http://portal:3010; proxy_set_header Host $host; }

    # SPA catch-all
    location / {
        try_files $uri $uri/ /index.html;
    }
}
